name: CI - Frontend
on:
  pull_request:
    paths: ["frontend/**", "backend/**", "docker-compose*.yml", "Makefile", ".github/workflows/ci-frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", "docker-compose*.yml", "Makefile", ".github/workflows/ci-frontend.yml"]
jobs:
  frontend:
    name: Biome, Vitest, Build e E2E full-stack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: make e2e
        working-directory: .
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
